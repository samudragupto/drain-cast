name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, tests, gunicorn boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt ruff==0.16.9

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit, API and data-integrity tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Boot with the production server and call the API
        working-directory: backend
        run: |
          gunicorn app:app --workers 1 --threads 4 --bind 127.0.0.1:8000 --daemon
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/api/wards | python -c "import json,sys; w=json.load(sys.stdin)['wards']; assert len(w)>=5, w; print(len(w), 'wards')"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"ward":"chennai-velachery","pattern":"burst","intensity":75}' \
            http://127.0.0.1:8000/api/simulate \
            | python -c "import json,sys; d=json.load(sys.stdin); assert len(d['frames'])==37; print('peak segments >=15cm:', max(s['counts']['high']+s['counts']['critical'] for s in d['stats']))"

  frontend:
    name: Frontend · tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Production build (lint warnings fail the build)
        run: npm run build
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7
